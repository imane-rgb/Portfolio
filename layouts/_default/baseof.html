<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Params.author }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}" />
</head>
<body>

  <div id="wallpaper" aria-hidden="true"></div>

  <!-- Cursor glow -->
  <div id="cursor-glow" aria-hidden="true" style="
    position:fixed;pointer-events:none;z-index:9999;
    width:400px;height:400px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,96,122,0.07) 0%,transparent 65%);
    transform:translate(-50%,-50%);
    transition:opacity 0.4s ease;
    opacity:0;
  "></div>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <a class="nav__logo" href="{{ "/" | relURL }}">{{ .Site.Params.author }}</a>
    <ul class="nav__links">
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
    <div class="nav__right">
      <a href="{{ .Site.Params.social.linkedin }}" class="nav__social" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        <span>LinkedIn</span>
      </a>
      <a href="{{ .Site.Params.social.cv }}" class="nav__cv" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        CV
      </a>
      <label class="nav__toggle" title="Toggle theme" aria-label="Toggle light/dark mode">
        <span class="toggle__icon">◐</span>
        <span class="toggle">
          <input type="checkbox" id="themeToggle" />
          <span class="toggle__track"></span>
          <span class="toggle__thumb"></span>
        </span>
      </label>
    </div>
  </nav>

  <main id="main">{{ block "main" . }}{{ end }}</main>

  <footer class="footer container">
    <span>{{ .Site.Params.author }} · {{ .Site.Params.institution }}</span>
    <span>
      <a href="{{ .Site.Params.social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      · <a href="{{ .Site.Params.social.github }}" target="_blank" rel="noopener">GitHub</a>
      {{ with .Site.Params.social.email }} · <a href="mailto:{{ . }}">{{ . }}</a>{{ end }}
    </span>
  </footer>

  <!-- Theme toggle -->
  <script>
  (function () {
    var toggle = document.getElementById('themeToggle');
    var html   = document.documentElement;
    var stored = localStorage.getItem('theme');
    var sys    = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var theme  = stored || sys;
    html.setAttribute('data-theme', theme);
    toggle.checked = (theme === 'dark');
    toggle.addEventListener('change', function () {
      var t = toggle.checked ? 'dark' : 'light';
      html.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
    });
  })();
  </script>

  <!-- Cursor glow -->
  <script>
  (function () {
    var glow = document.getElementById('cursor-glow');
    var visible = false;
    document.addEventListener('mousemove', function (e) {
      glow.style.left = e.clientX + 'px';
      glow.style.top  = e.clientY + 'px';
      if (!visible) { glow.style.opacity = '1'; visible = true; }
    });
    document.addEventListener('mouseleave', function () {
      glow.style.opacity = '0'; visible = false;
    });
  })();
  </script>

  <!-- Scroll reveal -->
  <script>
  (function () {
    var els = document.querySelectorAll('.reveal');
    if (!els.length) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    els.forEach(function (el) { io.observe(el); });
  })();
  </script>

  <!-- UI interactions -->
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // File explorer switching
    document.querySelectorAll('.tree__item[data-target]').forEach(function (item) {
      function activate() {
        var explorer = item.closest('.explorer');
        explorer.querySelectorAll('.tree__item').forEach(function (i) { i.classList.remove('is-active'); });
        explorer.querySelectorAll('.proj').forEach(function (p) { p.classList.remove('is-active'); });
        item.classList.add('is-active');
        var pane = document.getElementById(item.dataset.target);
        if (pane) pane.classList.add('is-active');
      }
      item.addEventListener('click', activate);
      item.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
      });
    });

    // Copy to clipboard
    document.querySelectorAll('.codeblock__copy').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var pre = btn.closest('.codeblock').querySelector('pre');
        if (!pre) return;
        navigator.clipboard.writeText(pre.innerText).then(function () {
          btn.textContent = 'copied';
          btn.classList.add('is-copied');
          setTimeout(function () { btn.textContent = 'copy'; btn.classList.remove('is-copied'); }, 2000);
        });
      });
    });
  });
  </script>

  {{ block "scripts" . }}{{ end }}
</body>
</html>
